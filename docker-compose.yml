services:
  db:
    image: postgres:17-alpine
    container_name: outpost-db
    environment:
      POSTGRES_USER: outpost
      POSTGRES_PASSWORD: outpost
      POSTGRES_DB: outpost
    ports:
      - "5433:5432"
    volumes:
      - outpost-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outpost -d outpost"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  outpost-pgdata:
